<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOP Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: control bar on top, editor (left) writes into a live controlled-document preview (right); stacks to tabs on phones. */
:root {
  --bg: #eef1f5;
  --panel: #ffffff;
  --sunk: #f5f7fa;
  --ink: #18212f;
  --muted: #5b6678;
  --line: #d6dce5;
  --accent: #2847a8;
  --accent-soft: #e4e9f7;
  --on-accent: #ffffff;
  --ok: #1d7a4f;
  --warn: #a35d00;
  --crit: #b3261e;
  --paper: #ffffff;
  --paper-ink: #1b2330;
  --paper-rule: #c9d1dc;
  --paper-head: #f0f3f8;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c; --panel: #161d28; --sunk: #1b2330; --ink: #e3e8f0; --muted: #98a3b5; --line: #2b3545;
    --accent: #8ea6f2; --accent-soft: #212c48; --on-accent: #0f141c; --ok: #5fc596; --warn: #e6a650; --crit: #f08a82;
    --paper: #1a212d; --paper-ink: #e3e8f0; --paper-rule: #344052; --paper-head: #212a38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141c; --panel: #161d28; --sunk: #1b2330; --ink: #e3e8f0; --muted: #98a3b5; --line: #2b3545;
  --accent: #8ea6f2; --accent-soft: #212c48; --on-accent: #0f141c; --ok: #5fc596; --warn: #e6a650; --crit: #f08a82;
  --paper: #1a212d; --paper-ink: #e3e8f0; --paper-rule: #344052; --paper-head: #212a38;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-direction: column; height: 100%; }

/* ---------- top bar ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font: 700 18px/1 var(--f-display); letter-spacing: .01em; display: flex; align-items: center; gap: 8px; margin-right: 8px; }
.brand-mark { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 4px; background: var(--accent); color: var(--on-accent); font: 600 11px/1 var(--f-mono); }
.lib { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: 1 1 320px; min-width: 0; }
.lib select { flex: 1 1 200px; min-width: 0; max-width: 380px; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--panel); padding: 6px 11px; border-radius: var(--r); cursor: pointer; white-space: nowrap; font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); color: var(--on-accent); }
.btn.danger:hover { border-color: var(--crit); color: var(--crit); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 7px; }
.btn.ghost:hover { color: var(--accent); border-color: transparent; }

.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.notice p { margin: 0; flex: 1 1 260px; }

/* ---------- workspace ---------- */
.tabs { display: none; gap: 4px; padding: 8px 16px 0; background: var(--bg); }
.tabs button { flex: 1; padding: 8px; border: 1px solid var(--line); border-bottom: none; border-radius: var(--r) var(--r) 0 0; background: var(--sunk); cursor: pointer; font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--accent); }
.work { flex: 1; display: grid; grid-template-columns: minmax(0, 46fr) minmax(0, 54fr); min-height: 0; }
.pane { overflow-y: auto; min-width: 0; }
.editor { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.preview-wrap { padding: 24px 16px; }

/* ---------- editor ---------- */
.typehead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.type-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font: 600 11px/1.6 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.type-pill.incident { background: color-mix(in srgb, var(--crit) 14%, transparent); color: var(--crit); }
.type-pill.service { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.progress { font: 500 12px/1 var(--f-mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.progress-track { width: 90px; height: 6px; border-radius: 3px; background: var(--sunk); border: 1px solid var(--line); overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); transition: width .2s; }

.sec { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-weight: 600; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary .num { font: 500 12px/1 var(--f-mono); color: var(--muted); min-width: 2.2em; font-variant-numeric: tabular-nums; }
.sec > summary .ttl { flex: 1; min-width: 0; }
.sec > summary .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; }
.sec.filled > summary .dot { background: var(--ok); border-color: var(--ok); }
.sec > summary .chev { color: var(--muted); transition: transform .15s; }
.sec[open] > summary .chev { transform: rotate(90deg); }
.sec-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.kind-tag { font: 500 10px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); padding: 3px 5px; border-radius: 3px; }

label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
.inp, textarea.inp { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); color: var(--ink); font-size: 14px; font-weight: 400; }
textarea.inp { resize: vertical; min-height: 64px; line-height: 1.45; }
.inp:focus { border-color: var(--accent); background: var(--panel); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }

.row { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); }
.row-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.row-num { font: 600 12px/1 var(--f-mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.row-tools { display: flex; gap: 2px; }
.row .inp { background: var(--panel); }
.list-row { display: flex; gap: 6px; align-items: center; }
.list-row .inp { flex: 1; min-width: 0; }
.add { align-self: flex-start; border-style: dashed; color: var(--accent); }

.custom-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; padding: 12px; border: 1px dashed var(--line); border-radius: var(--r); }
.custom-add label.fld { flex: 1 1 180px; }

/* ---------- new-SOP dialog (in-page) ---------- */
.sheet { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 40%, transparent); display: grid; place-items: center; padding: 16px; z-index: 10; }
.sheet-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(560px, 100%); padding: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 100%; overflow-y: auto; }
.sheet-card h2 { margin: 0; font: 700 22px/1.2 var(--f-display); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.choice { text-align: left; border: 1.5px solid var(--line); border-radius: 8px; padding: 12px; background: var(--sunk); cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.choice strong { font: 600 16px/1.2 var(--f-display); }
.choice span { color: var(--muted); font-size: 13px; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

/* ---------- document preview ---------- */
.paper { max-width: 860px; margin: 0 auto; background: var(--paper); color: var(--paper-ink); border: 1px solid var(--paper-rule); border-radius: 4px; padding: 40px clamp(18px, 5vw, 56px); box-shadow: 0 1px 2px rgba(15, 20, 30, .06), 0 8px 28px rgba(15, 20, 30, .06); }
.doc-eyebrow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; font: 500 11px/1.4 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 2px solid var(--paper-ink); }
.doc-title { font: 700 clamp(24px, 3.4vw, 34px)/1.1 var(--f-display); margin: 18px 0 18px; text-wrap: balance; }
.doc-title.empty { color: var(--muted); font-style: italic; font-weight: 500; }
.control { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 28px; }
.control th, .control td { border: 1px solid var(--paper-rule); padding: 6px 9px; text-align: left; vertical-align: top; }
.control th { background: var(--paper-head); font-weight: 600; width: 17%; white-space: nowrap; font-size: 12px; }
.control td { font-family: var(--f-mono); font-size: 12.5px; width: 33%; overflow-wrap: anywhere; }
.doc-sec { margin-top: 26px; }
.doc-sec h2 { font: 600 19px/1.25 var(--f-display); margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; text-wrap: balance; }
.doc-sec h2 .n { font: 500 13px/1 var(--f-mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.doc-sec p { margin: 0 0 8px; max-width: 70ch; white-space: pre-wrap; }
.doc-sec ul { margin: 0; padding-left: 20px; }
.doc-sec li { margin: 2px 0; }
.tbl-scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { border: 1px solid var(--paper-rule); padding: 6px 9px; text-align: left; vertical-align: top; white-space: pre-wrap; }
.tbl th { background: var(--paper-head); font-weight: 600; font-size: 12px; }
.tbl td.step { font: 600 12px/1.5 var(--f-mono); color: var(--accent); white-space: nowrap; width: 1%; font-variant-numeric: tabular-nums; }
.tbl td code, .doc-sec code { font-family: var(--f-mono); font-size: 12px; }
.placeholder { color: var(--muted); font-style: italic; font-size: 13px; margin: 0; }
.sev { display: inline-block; font: 600 11px/1.5 var(--f-mono); padding: 0 6px; border-radius: 3px; color: var(--paper); }
.sev.s1 { background: var(--crit); } .sev.s2 { background: var(--warn); } .sev.s3 { background: var(--accent); } .sev.s4 { background: var(--muted); }
.doc-foot { margin-top: 36px; padding-top: 10px; border-top: 1px solid var(--paper-rule); font: 500 11px/1.4 var(--f-mono); color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--r); font-weight: 500; z-index: 20; }
.copy-fallback { width: 100%; min-height: 220px; font: 12px/1.4 var(--f-mono); }

@media (max-width: 860px) {
  .tabs { display: flex; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .work[data-view="edit"] .preview-wrap { display: none; }
  .work[data-view="preview"] .editor { display: none; }
  .editor { border-right: none; }
  .preview-wrap { padding: 16px; }
  .paper { padding: 24px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

@media print {
  body { background: #fff; }
  .bar, .notice, .tabs, .editor, .toast, .sheet { display: none !important; }
  .app, .work, .pane { display: block; height: auto; overflow: visible; }
  .preview-wrap { padding: 0; display: block !important; }
  .paper { box-shadow: none; border: none; max-width: none; padding: 0; background: #fff; color: #000; }
  .doc-sec { break-inside: avoid-page; }
  .tbl tr { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="brand-mark">SOP</span>SOP Builder</div>
    <div class="lib">
      <label for="docSelect" class="hint" style="font-weight:600">Document</label>
      <select id="docSelect" aria-label="Choose SOP document"></select>
      <button class="btn primary" id="newBtn" type="button">New SOP</button>
      <button class="btn" id="dupBtn" type="button">Duplicate</button>
      <button class="btn danger" id="delBtn" type="button">Delete</button>
    </div>
    <div class="actions">
      <button class="btn" id="copyMdBtn" type="button">Copy Markdown</button>
      <button class="btn" id="dlMdBtn" type="button" data-standalone>Download .md</button>
      <button class="btn" id="dlHtmlBtn" type="button" data-standalone>Download .html</button>
      <button class="btn" id="dlJsonBtn" type="button" data-standalone>Export .json</button>
      <label class="btn" for="importFile" data-standalone>Import .json</label>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button class="btn" id="printBtn" type="button" data-standalone>Print / PDF</button>
    </div>
  </header>
  <div class="notice" id="confirmBar" hidden>
    <p id="confirmText"></p>
    <button class="btn danger" id="confirmYes" type="button">Delete</button>
    <button class="btn" id="confirmNo" type="button">Cancel</button>
  </div>
  <div class="notice" id="copyBar" hidden>
    <p>Your browser blocked clipboard access. Select the text below and copy it.</p>
    <button class="btn" id="copyClose" type="button">Close</button>
    <textarea class="inp copy-fallback" id="copyText" readonly></textarea>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tabEdit" aria-selected="true">Edit</button>
    <button type="button" role="tab" id="tabPreview" aria-selected="false">Preview</button>
  </nav>
  <main class="work" id="work" data-view="edit">
    <section class="pane editor" id="editor" aria-label="Editor"></section>
    <section class="pane preview-wrap" id="previewPane" aria-label="Preview"><article class="paper" id="paper"></article></section>
  </main>
</div>

<div class="sheet" id="newSheet" hidden>
  <form class="sheet-card" id="newForm">
    <h2>New SOP</h2>
    <p class="hint">Pick the kind of procedure. Each one comes with its own set of sections and step phases.</p>
    <div class="choices">
      <button type="button" class="choice" data-type="service" aria-pressed="true"><strong>Service request</strong><span>Planned, repeatable fulfilment: access, provisioning, changes, data requests.</span></button>
      <button type="button" class="choice" data-type="incident" aria-pressed="false"><strong>Production incident</strong><span>Unplanned disruption: detect, triage, mitigate, communicate, recover, review.</span></button>
    </div>
    <label class="fld">SOP title<input class="inp" id="newTitle" required placeholder="e.g. Grant read-only production DB access"></label>
    <div class="sheet-foot">
      <button type="button" class="btn" id="newCancel">Cancel</button>
      <button type="submit" class="btn primary">Create SOP</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  /* ================= Templates ================= */
  const STEP_COLS = [
    { k: "action", label: "Action" },
    { k: "owner", label: "Responsible" },
    { k: "details", label: "Details / commands", long: true },
    { k: "expected", label: "Expected result", long: true }
  ];
  const COMMON_START = [
    { key: "purpose", title: "Purpose", kind: "text", hint: "Why this SOP exists and what outcome it guarantees." },
    { key: "scope", title: "Scope", kind: "text", hint: "Systems, services, teams and hours covered. Say what is out of scope." },
    { key: "roles", title: "Roles & responsibilities", kind: "table", hint: "Who does what while this procedure runs.",
      cols: [{ k: "role", label: "Role" }, { k: "resp", label: "Responsibility", long: true }, { k: "contact", label: "Contact / team" }] },
    { key: "definitions", title: "Definitions", kind: "table", hint: "Acronyms and terms a new engineer might not know.",
      cols: [{ k: "term", label: "Term" }, { k: "meaning", label: "Meaning", long: true }] },
    { key: "prereq", title: "Prerequisites", kind: "list", hint: "Access, tools and approvals needed before starting." }
  ];
  const COMMON_END = [
    { key: "escalation", title: "Escalation matrix", kind: "table", hint: "When to pull in the next level, and how to reach them.",
      cols: [{ k: "level", label: "Level" }, { k: "when", label: "Escalate when", long: true }, { k: "contact", label: "Contact" }, { k: "channel", label: "Channel" }] },
    { key: "references", title: "References", kind: "list", hint: "Runbooks, dashboards, KB articles and related SOPs." },
    { key: "revisions", title: "Revision history", kind: "table",
      cols: [{ k: "version", label: "Version" }, { k: "date", label: "Date" }, { k: "author", label: "Author" }, { k: "change", label: "Change", long: true }] }
  ];
  const TEMPLATES = {
    service: {
      label: "Service request",
      sections: [
        ...COMMON_START,
        { key: "profile", title: "Request profile", kind: "fields", hint: "How this request arrives and the targets it is measured against.",
          fields: [{ k: "category", label: "Request category" }, { k: "channel", label: "Request channel" }, { k: "priority", label: "Default priority" },
                   { k: "responseSla", label: "Response SLA" }, { k: "fulfilSla", label: "Fulfilment SLA" }, { k: "approval", label: "Approval required" }] },
        { key: "inputs", title: "Information required from requester", kind: "list", hint: "What the ticket must contain before work starts." },
        { key: "intake", title: "Intake & validation", kind: "steps", hint: "Receive, check completeness, categorise and assign." },
        { key: "approval", title: "Approval", kind: "steps", hint: "Who approves, how it is recorded, what happens on rejection." },
        { key: "fulfil", title: "Fulfilment procedure", kind: "steps", hint: "The actual work, step by step. Put exact commands in Details." },
        { key: "closure", title: "Verification & closure", kind: "steps", hint: "Confirm with the requester and close the ticket." },
        { key: "comms", title: "Communication templates", kind: "text", hint: "Messages to send to the requester at each stage." }
      ]
    },
    incident: {
      label: "Production incident",
      sections: [
        ...COMMON_START,
        { key: "profile", title: "Incident profile", kind: "fields", hint: "The service this SOP covers and where the response happens.",
          fields: [{ k: "service", label: "Service affected" }, { k: "detection", label: "Detection source" }, { k: "severity", label: "Default severity" },
                   { k: "commander", label: "Incident commander" }, { k: "bridge", label: "Bridge / war room" }, { k: "status", label: "Status page" }] },
        { key: "severity", title: "Severity matrix", kind: "table", hint: "Use P1 to P4 in the first column to get coloured labels.",
          cols: [{ k: "sev", label: "Severity" }, { k: "def", label: "Definition", long: true }, { k: "response", label: "Response time" }, { k: "cadence", label: "Update cadence" }] },
        { key: "triggers", title: "Detection & triggers", kind: "list", hint: "Alerts, symptoms or reports that start this procedure." },
        { key: "detect", title: "Detect & log", kind: "steps", hint: "Acknowledge the alert and open the incident record." },
        { key: "triage", title: "Triage & assess", kind: "steps", hint: "Confirm impact, set severity, assemble the team." },
        { key: "contain", title: "Contain & mitigate", kind: "steps", hint: "Stop the bleeding: rollback, failover, feature flags, scaling." },
        { key: "communicate", title: "Communicate", kind: "steps", hint: "Stakeholder and customer updates during the incident." },
        { key: "resolve", title: "Resolve & recover", kind: "steps", hint: "Fix the cause, restore service, verify health." },
        { key: "review", title: "Close & post-incident review", kind: "steps", hint: "Closure, RCA, action items, knowledge base." },
        { key: "comms", title: "Communication templates", kind: "text", hint: "Initial notice, update and resolution messages." }
      ]
    }
  };
  const CUSTOM_KINDS = { text: "Paragraph", list: "Bullet list", steps: "Procedure steps" };
  const META = [
    { k: "id", label: "Document ID" }, { k: "version", label: "Version" },
    { k: "owner", label: "Owner" }, { k: "department", label: "Department" },
    { k: "effective", label: "Effective date", type: "date" }, { k: "review", label: "Next review", type: "date" },
    { k: "approver", label: "Approved by" }, { k: "status", label: "Status", options: ["Draft", "In review", "Approved", "Retired"] }
  ];

  function sectionsFor(doc) {
    const base = TEMPLATES[doc.type].sections;
    const custom = (doc.custom || []).map(c => ({ key: c.key, title: c.title, kind: c.kind, custom: true,
      cols: c.kind === "steps" ? STEP_COLS : undefined }));
    const i = base.findIndex(s => s.key === "escalation");
    return [...base.slice(0, i), ...custom, ...base.slice(i)].map(s => s.kind === "steps" ? { ...s, cols: STEP_COLS } : s);
  }

  /* ================= Example documents ================= */

  /* ================= Storage ================= */
  const KEY = "sop-builder-v1";

  function load() {
    try {
      const raw = localStorage.getItem(KEY);

    } catch (e) { /* storage unavailable */ }

  }
  let saveTimer;
  function save() {

  /* ================= Helpers ================= */
  const $ = id => document.getElementById(id);
  function h(tag, attrs, ...kids) {

  /* ================= Editor ================= */
  const collapsed = new Set();

  function renderEditor() {
    const doc = cur();

    ed.append(h("div", { class: "typehead" },

      h("label", { class: "fld" }, "SOP title", input(doc.title, v => { doc.title = v; }, { id: "f-title" })),
      h("div", { class: "grid2" }, META.map(m => h("label", { class: "fld" }, m.label,
        m.options ? select(m.options, doc.meta[m.k], v => doc.meta[m.k] = v, "f-meta-" + m.k)

      ed.append(secWrap(sec.key, String(i + 1), sec.title, body, has(doc.s[sec.key]), sec.kind));

      h("button", { type: "button", class: "btn", onclick: () => {

  function secWrap(key, num, title, body, filled, kind) {
    const d = h("details", { class: "sec" + (filled ? " filled" : ""), "data-key": key, open: !collapsed.has(key) },
      h("summary", null, h("span", { class: "num", text: num }), h("span", { class: "ttl", text: title }),
        h("span", { class: "kind-tag", text: kind === "steps" ? "steps" : kind }), h("span", { class: "dot", title: filled ? "Has content" : "Empty" }),
        h("span", { class: "chev", "aria-hidden": "true", text: "›" })),

  function markFilled(key) {

  function fieldFor(doc, sec, num) {
    const key = sec.key;
    const after = () => markFilled(key);
    if (sec.kind === "text") {
      return textarea(doc.s[key], v => { doc.s[key] = v; after(); }, { id: "f-" + key, rows: 5 });
    }
    if (sec.kind === "fields") {
      doc.s[key] = doc.s[key] || {};
      return h("div", { class: "grid2" }, sec.fields.map(f => h("label", { class: "fld" }, f.label,
        input(doc.s[key][f.k], v => { doc.s[key][f.k] = v; after(); }, { id: `f-${key}-${f.k}` }))));
    }
    if (sec.kind === "list") {

    }
    // table / steps
    const rows = doc.s[key] = doc.s[key] || [];
    const wrap = h("div", { class: "sec-body", style: "padding:0" });
    const isSteps = sec.kind === "steps";
    rows.forEach((row, r) => {
      wrap.append(h("div", { class: "row" },
        h("div", { class: "row-head" }, h("span", { class: "row-num", text: isSteps ? `Step ${num}.${r + 1}` : `Row ${r + 1}` }), rowTools(rows, r)),
        h("div", { class: "grid2" }, sec.cols.filter(c => !c.long).map(c => h("label", { class: "fld" }, c.label,
          input(row[c.k], v => { row[c.k] = v; after(); }, { id: `f-${key}-${r}-${c.k}` })))),
        sec.cols.filter(c => c.long).map(c => h("label", { class: "fld" }, c.label,
          textarea(row[c.k], v => { row[c.k] = v; after(); }, { id: `f-${key}-${r}-${c.k}`, rows: 2 })))));
    });
    wrap.append(h("button", { type: "button", class: "btn add", onclick: () => {
      rows.push(Object.fromEntries(sec.cols.map(c => [c.k, ""]))); rerenderFocus(`f-${key}-${rows.length - 1}-${sec.cols[0].k}`);

  function rowTools(arr, r) {

  /* ================= Preview (HTML) ================= */
  function sevBadge(v) {
    const m = /^\s*(?:P|SEV-?)([1-4])\b/i.exec(v || "");
    return m ? `<span class="sev s${m[1]}">${esc(v)}</span>` : esc(v);
  }
  function docHTML(doc) {
    const secs = sectionsFor(doc);
    const mrow = (a, b) => `<tr><th>${esc(a.label)}</th><td>${esc(doc.meta[a.k]) || "—"}</td><th>${esc(b.label)}</th><td>${esc(doc.meta[b.k]) || "—"}</td></tr>`;
    let out = `<div class="doc-eyebrow"><span>Standard Operating Procedure · ${esc(TEMPLATES[doc.type].label)}</span><span>${esc(doc.meta.id || "No ID")} · v${esc(doc.meta.version || "—")}</span></div>`;

    out += `<div class="tbl-scroll"><table class="control">`;
    for (let i = 0; i < META.length; i += 2) out += mrow(META[i], META[i + 1]);
    out += `</table></div>`;
    secs.forEach((sec, i) => {
      const n = i + 1, v = doc.s[sec.key];

      else if (sec.kind === "fields") {

      } else {
        const steps = sec.kind === "steps";
        const rows = v.filter(has);
        out += `<div class="tbl-scroll"><table class="tbl"><thead><tr>${steps ? "<th>Step</th>" : ""}${sec.cols.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>`;
        rows.forEach((r, j) => {
          out += `<tr>${steps ? `<td class="step">${n}.${j + 1}</td>` : ""}${sec.cols.map((c, ci) => `<td>${sec.key === "severity" && ci === 0 ? sevBadge(r[c.k]) : esc(r[c.k])}</td>`).join("")}</tr>`;

  }

  /* ================= Markdown ================= */
  function cell(s) { return String(s ?? "").replace(/\|/g, "\\|").replace(/\r?\n/g, "<br>"); }
  function toMarkdown(doc) {
    const L = [];
    L.push(`# ${doc.title || "Untitled SOP"}`, "", `*Standard Operating Procedure · ${TEMPLATES[doc.type].label}*`, "");
    L.push("| Field | Value | Field | Value |", "|---|---|---|---|");
    for (let i = 0; i < META.length; i += 2) L.push(`| **${META[i].label}** | ${cell(doc.meta[META[i].k])} | **${META[i + 1].label}** | ${cell(doc.meta[META[i + 1].k])} |`);
    sectionsFor(doc).forEach((sec, i) => {
      const n = i + 1, v = doc.s[sec.key];
      L.push("", `## ${n}. ${sec.title}`, "");
      if (!has(v)) { L.push("_Not yet written._"); return; }
      if (sec.kind === "text") L.push(String(v).trim());
      else if (sec.kind === "list") v.filter(has).forEach(x => L.push(`- ${x}`));
      else if (sec.kind === "fields") { L.push("| Item | Value |", "|---|---|"); sec.fields.filter(f => has(v[f.k])).forEach(f => L.push(`| ${f.label} | ${cell(v[f.k])} |`)); }
      else {
        const steps = sec.kind === "steps";
        L.push(`| ${steps ? "Step | " : ""}${sec.cols.map(c => c.label).join(" | ")} |`, `|${steps ? "---|" : ""}${sec.cols.map(() => "---").join("|")}|`);
        v.filter(has).forEach((r, j) => L.push(`| ${steps ? `${n}.${j + 1} | ` : ""}${sec.cols.map(c => cell(r[c.k])).join(" | ")} |`));
      }
    });
    return L.join("\n") + "\n";
  }
  function standaloneHTML(doc) {
    const css = document.querySelector("style").textContent;
    return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(doc.title)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"><style>${css}</style></head><body><div class="preview-wrap"><article class="paper">${docHTML(doc)}</article></div></body></html>`;
  }

  /* ================= Library / toolbar ================= */
  function renderSelect() {
    const sel = $("docSelect"), doc = cur();
    const opts = state.docs.map(d => `<option value="${esc(d.id)}">${esc((d.meta.id ? d.meta.id + " · " : "") + (d.title || "Untitled"))}${d.example ? " (example)" : ""}</option>`).join("");
    if (sel.innerHTML !== opts) sel.innerHTML = opts;
    sel.value = doc.id;
  }
  function openDoc(id) { state.current = id; save(); renderAll(); }
  function renderAll() { renderSelect(); renderEditor(); renderPreview(); }

  $("docSelect").addEventListener("change", e => openDoc(e.target.value));

  let newType = "service";
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
    newType = b.dataset.type;
    document.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));
  $("newBtn").addEventListener("click", () => { $("newSheet").hidden = false; $("newTitle").value = ""; $("newTitle").focus(); });
  $("newCancel").addEventListener("click", () => $("newSheet").hidden = true);
  $("newSheet").addEventListener("click", e => { if (e.target.id === "newSheet") $("newSheet").hidden = true; });
  $("newForm").addEventListener("submit", e => {
    e.preventDefault();
    const d = blankDoc(newType, $("newTitle").value.trim());
    state.docs.push(d); $("newSheet").hidden = true; openDoc(d.id); toast("SOP created");
  });
  $("dupBtn").addEventListener("click", () => {
    const d = JSON.parse(JSON.stringify(cur()));
    d.id = uid(); d.example = false; d.title = (d.title || "Untitled") + " (copy)"; d.meta.status = "Draft";
    state.docs.push(d); openDoc(d.id); toast("Duplicated");
  });
  $("delBtn").addEventListener("click", () => {
    $("confirmText").textContent = `Delete “${cur().title || "Untitled SOP"}”? This cannot be undone.`;
    $("confirmBar").hidden = false;
  });
  $("confirmNo").addEventListener("click", () => $("confirmBar").hidden = true);
  $("confirmYes").addEventListener("click", () => {
    state.docs = state.docs.filter(d => d.id !== state.current);
    if (!state.docs.length) state.docs.push(blankDoc("service", ""));
    $("confirmBar").hidden = true; openDoc(state.docs[0].id); toast("Deleted");
  });

  $("copyMdBtn").addEventListener("click", () => {
    const md = toMarkdown(cur());
    const fallback = () => { $("copyText").value = md; $("copyBar").hidden = false; $("copyText").focus(); $("copyText").select(); };
    try { navigator.clipboard.writeText(md).then(() => toast("Markdown copied"), fallback); } catch (e) { fallback(); }
  });
  $("copyClose").addEventListener("click", () => $("copyBar").hidden = true);

  function slug(doc) { return ((doc.meta.id ? doc.meta.id + "-" : "") + (doc.title || "sop")).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function download(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $("dlMdBtn").addEventListener("click", () => download(slug(cur()) + ".md", toMarkdown(cur()), "text/markdown"));
  $("dlHtmlBtn").addEventListener("click", () => download(slug(cur()) + ".html", standaloneHTML(cur()), "text/html"));
  $("dlJsonBtn").addEventListener("click", () => download(slug(cur()) + ".json", JSON.stringify(cur(), null, 2), "application/json"));
  $("importFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!TEMPLATES[d.type] || !d.meta || !d.s) throw new Error("bad");
        d.id = uid(); d.custom = d.custom || []; d.example = false;
        state.docs.push(d); openDoc(d.id); toast("Imported");
      } catch (err) { toast("That file is not an SOP Builder export (.json)"); }
      e.target.value = "";
    };
    rd.readAsText(f);
  });
  $("printBtn").addEventListener("click", () => window.print());

  // Downloads and printing are unavailable when the page is embedded in a sandboxed frame.
  let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (framed) document.querySelectorAll("[data-standalone]").forEach(n => n.hidden = true);

  // phone tabs
  function view(v) { $("work").dataset.view = v; $("tabEdit").setAttribute("aria-selected", String(v === "edit")); $("tabPreview").setAttribute("aria-selected", String(v === "preview")); }
  $("tabEdit").addEventListener("click", () => view("edit"));
  $("tabPreview").addEventListener("click", () => view("preview"));

  renderAll();
})();
</script>
</body>
</html>
