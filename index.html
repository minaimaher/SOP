<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOP Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Carlito:wght@400;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="brand-mark">SOP</span><span>SOP Builder</span></div>
    <div class="lib">
      <select id="docSelect" class="inp" aria-label="Open manual"></select>
      <button class="btn" id="newBtn" type="button">New</button>
      <button class="btn" id="dupBtn" type="button">Duplicate</button>
      <button class="btn danger" id="delBtn" type="button">Delete</button>
    </div>
    <div class="actions">
      <label class="btn" for="importFile">Import config</label>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button class="btn" id="exportBtn" type="button">Export config</button>
      <button class="btn primary" id="docxBtn" type="button">Download Word (.docx)</button>
    </div>
  </header>
  <div class="notice" id="confirmBar" hidden>
    <p id="confirmText"></p>
    <button class="btn danger solid" id="confirmYes" type="button">Delete</button>
    <button class="btn" id="confirmNo" type="button">Cancel</button>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-view="outline" aria-selected="false">Outline</button>
    <button type="button" role="tab" data-view="edit" aria-selected="true">Edit</button>
    <button type="button" role="tab" data-view="preview" aria-selected="false">Preview</button>
  </nav>
  <main class="work" id="work" data-view="edit">
    <nav class="pane outline" id="outline" aria-label="Outline"></nav>
    <section class="pane editor" id="editor" aria-label="Editor"></section>
    <section class="pane preview" id="previewPane" aria-label="Preview">
      <div class="pv-bar"><span id="stats"></span><span id="saveState">Saved in this browser</span></div>
      <article class="paper" id="paper"></article>
    </section>
  </main>
</div>

<div class="sheet" id="newSheet" hidden>
  <div class="sheet-card" role="dialog" aria-labelledby="newTitle">
    <div class="sheet-head"><h2 id="newTitle">New manual</h2><button type="button" class="btn icon" id="newClose" aria-label="Close">✕</button></div>
    <p class="hint">Start from a blank manual or copy one of the full manuals and change it to fit your process.</p>
    <div class="choices" id="newChoices"></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="vendor/jszip.min.js"></script>
<script src="presets/sdb-crm-sop-ar.js"></script>
<script src="presets/sdb-crm-sop-en.js"></script>
<script src="js/model.js"></script>
<script src="js/docx-writer.js"></script>
<script src="js/preview.js"></script>
<script src="js/app.js"></script>
</body>
</html>
