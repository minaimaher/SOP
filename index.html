<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOP Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Carlito:wght@400;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=202610202015">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="brand-mark">SOP</span><span>SOP Builder</span></div>
    <div class="lib">
      <select id="docSelect" class="inp" aria-label="Open manual"></select>
      <button class="btn" id="newBtn" type="button">New</button>
      <div id="manualMenu"></div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <div class="panels" id="panelToggles" role="group" aria-label="Show or hide panels">
      <button type="button" class="seg" data-panel="outline" aria-pressed="true">Outline</button><button type="button" class="seg" data-panel="editor" aria-pressed="true">Editor</button><button type="button" class="seg" data-panel="preview" aria-pressed="true">Preview</button>
    </div>
    <div class="actions">
      <button class="btn" id="previewBtn" type="button" title="Open the Word document view in a new tab">Preview page ↗</button>
      <button class="btn primary" id="docxBtn" type="button">Download Word (.docx)</button>
      <div id="account"></div>
    </div>
  </header>
  <div class="notice" id="confirmBar" hidden>
    <p id="confirmText"></p>
    <button class="btn danger solid" id="confirmYes" type="button">Delete</button>
    <button class="btn" id="confirmNo" type="button">Cancel</button>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-view="outline" aria-selected="false">Outline</button>
    <button type="button" role="tab" data-view="edit" aria-selected="true">Edit</button>
    <button type="button" role="tab" data-view="preview" aria-selected="false">Preview</button>
  </nav>
  <main class="work" id="work" data-view="edit">
    <nav class="pane outline" id="outline" aria-label="Outline"></nav>
    <div class="split" data-split="outline" role="separator" aria-orientation="vertical" aria-label="Resize outline" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <section class="pane editor" id="editor" aria-label="Editor"></section>
    <div class="split" data-split="preview" role="separator" aria-orientation="vertical" aria-label="Resize preview" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <section class="pane preview" id="previewPane" aria-label="Preview">
      <div class="pv-bar"><span id="stats"></span><span class="pv-bar-end"><span id="saveState">Loading…</span><button type="button" class="pane-hide" data-hide="preview" title="Hide the preview" aria-label="Hide the preview">✕</button></span></div>
      <article class="paper" id="paper"></article>
    </section>
  </main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button type="button" class="btn icon" id="sheetClose" aria-label="Close">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="vendor/jszip.min.js?v=202610202015"></script>
<script src="presets/sdb-crm-sop-ar.js?v=202610202015"></script>
<script src="presets/sdb-crm-sop-en.js?v=202610202015"></script>
<script src="js/model.js?v=202610202015"></script>
<script src="js/docx-writer.js?v=202610202015"></script>
<script src="js/automation.js?v=202610202015"></script>
<script src="js/preview.js?v=202610202015"></script>
<script src="js/firebase-config.js?v=202610202015"></script>
<script src="js/store.js?v=202610202015"></script>
<script src="js/app.js?v=202610202015"></script>
</body>
</html>
